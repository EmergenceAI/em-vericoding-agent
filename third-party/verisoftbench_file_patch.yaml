pcf-lean/PCF/Flat.lean:
  - before: |-
      theorem flat_lift_converse {f : α → β} {a : Flat α} (p : lift_flat f a ≠ .none) : (a ≠ .none) := by
        intro q
        rw [q] at p
        exact p rfl

      def Mono.flat (f : α → β) : (Mono (Flat α) (Flat β)) := ⟨
          lift_flat f,
          by {
            intro a b a_b
            cases a with
            | none => exact Domain.is_bot
            | some =>
              rw [a_b Flat.noConfusion]
              exact ⋆
          }
        ⟩

      def Cont.flat (f : α → β) : (Cont (Flat α) (Flat β)) := (Mono.flat f).promote_trivial
    after: |-
      theorem flat_lift_converse {f : α → β} {a : Flat α} (p : lift_flat f a ≠ .none) : (a ≠ .none) := by
        intro q
        rw [q] at p
        exact p rfl

      noncomputable def Mono.flat (f : α → β) : (Mono (Flat α) (Flat β)) := ⟨
          lift_flat f,
          by {
            intro a b a_b
            cases a with
            | none => exact Domain.is_bot
            | some =>
              rw [a_b Flat.noConfusion]
              exact ⋆
          }
        ⟩

      noncomputable def Cont.flat (f : α → β) : (Cont (Flat α) (Flat β)) := (Mono.flat f).promote_trivial
