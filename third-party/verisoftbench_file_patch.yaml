  - before: |-
      := by
        induction a with
        | a_num _ => rfl
        | a_plus a₁ a₂ iha₁ iha₂ =>
            unfold optimize_0plus
            cases a₁ with simp [aeval] at *
            | a_num n =>
              cases n with simp [aeval]
              | zero => exact iha₂
              | succ _ => rw [iha₂]
            | _ => rw [iha₁, iha₂]
        | a_minus a₁ a₂ iha₁ iha₂ =>
            simp [optimize_0plus, aeval]
            rw [iha₁, iha₂]
        | a_mult a₁ a₂ iha₁ iha₂ =>
            simp [optimize_0plus, aeval]
            rw [iha₁, iha₂]
    after: |-
      := by sorry
