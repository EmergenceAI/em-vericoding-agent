clean/Clean/Tables/Fibonacci32.lean:
  - before: |-
      := by
          intro N trace envs _
          simp only [fib32Table, Spec]
          rw [TraceOfLength.ForAllRowsOfTraceWithIndex, Trace.ForAllRowsOfTraceWithIndex, TableConstraintsHold]

          /-
            We prove the soundness of the table by induction on the trace.
          -/
          induction' trace.val using Trace.every_row_two_rows_induction with first_row curr next rest _ ih2
          -- base case 1
          · simp [table_norm]

          -- base case 2
          · simp [table_norm]
            apply boundary_constraints first_row (envs 0 0)

          -- inductive step
          · simp [table_norm] at ih2 ⊢
            intro ConstraintsHold boundary rest
            -- first of all, we prove the inductive part of the Spec

            specialize ih2 boundary rest
            simp only [ih2, and_self, and_true]

            let ⟨curr_fib0, curr_fib1, curr_normalized_x, curr_normalized_y⟩ := ih2.left

            -- simplfy constraints
            have ⟨ eq_spec, add_spec ⟩ := fib_constraints curr next (envs 1 _) ConstraintsHold

            -- finish induction
            specialize add_spec curr_normalized_x curr_normalized_y
            simp only [fib32]
            rw [←curr_fib0, ←curr_fib1, ←eq_spec]
            simp only [curr_fib1, add_spec, Nat.reducePow, and_self, curr_normalized_y]
    after: |-
      := by sorry
clean/Clean/Tables/Fibonacci8.lean:
  - before: |-
      := by
        induction' n using Nat.twoStepInduction
        repeat {simp [fib8]}; apply Nat.mod_lt; simp
    after: |-
      := by sorry
  - before: |-
      := by
          intro N trace envs _
          simp only [TableConstraintsHold,
            fibTable, Spec, TraceOfLength.ForAllRowsOfTraceWithIndex, Trace.ForAllRowsOfTraceWithIndex]

          induction' trace.val using Trace.every_row_two_rows_induction with first_row curr next rest _ ih2
          · simp [table_norm]
          · simp [table_norm]
            exact boundary_step first_row (envs 0 0)
          · -- first, we prove the inductive part of the Spec
            -- TODO this should be easier, or there should be a custom induction for it
            unfold Trace.ForAllRowsOfTraceWithIndex.inner
            intros ConstraintsHold

            simp only [table_norm] at ConstraintsHold
            simp at ConstraintsHold
            unfold TableConstraintsHold.foldl at ConstraintsHold
            unfold TableConstraintsHold.foldl at ConstraintsHold
            unfold TableConstraintsHold.foldl at ConstraintsHold
            simp [Trace.len] at ConstraintsHold
            specialize ih2 ConstraintsHold.right
            simp only [ih2, and_true, Trace.len]

            let ⟨curr_fib0, curr_fib1⟩ := ih2.left

            -- simplify constraints
            replace ConstraintsHold := ConstraintsHold.left
            simp [table_norm] at ConstraintsHold

            set env := fibRelation.windowEnv ⟨<+> +> curr +> next, rfl⟩ (envs 1 (rest.len + 1))

            simp only [fibRelation, circuit_norm, table_norm, table_assignment_norm, copyToVar,
                Gadgets.Addition8.circuit] at ConstraintsHold
            simp only [circuit_norm, varFromOffset, Vector.mapRange] at ConstraintsHold

            have hx_curr : env.get 0 = curr.x := by rfl
            have hy_curr : env.get 1 = curr.y := by rfl
            have hx_next : env.get 2 = next.x := by rfl
            have hy_next : env.get (2 + 1) = next.y := by rfl
            rw [hx_curr, hy_curr, hx_next, hy_next] at ConstraintsHold
            clear hx_curr hy_curr hx_next hy_next

            have ⟨eq_holds, add_holds⟩ := ConstraintsHold
            rw [add_neg_eq_zero] at eq_holds

            -- and finally now we prove the actual relations

            have lookup_first_col : curr.x.val < 256 := by
              -- This is true also by induction, because we proved that
              -- curr.x is exactly fib8 index, and fib8 is always less than 256
              rw [ih2.left.left]
              apply fib8_less_than_256

            have lookup_second_col : curr.y.val < 256 := by
              rw [ih2.left.right]
              apply fib8_less_than_256

            specialize add_holds ⟨ lookup_first_col, lookup_second_col ⟩

            have spec1 : next.x.val = fib8 (rest.len + 1) := by
              rw [←curr_fib1]
              congr
              exact eq_holds.symm

            have spec2 : (next.y).val = fib8 (rest.len + 2) := by
              simp only [fib8]
              rw [←curr_fib0, ←curr_fib1]
              assumption

            exact ⟨spec1, spec2⟩
    after: |-
      := by sorry
clean/Clean/Gadgets/BLAKE3/ApplyRounds.lean:
  - before: |-
      by
          -- Prove that fourRoundsWithPermute's spec implies our FourRoundsSpec
          intro input output h_assumptions h_spec
          -- fourRoundsWithPermute.Spec says ∃ mid, twoRoundsWithPermute.Spec input mid ∧ twoRoundsWithPermute.Spec mid output
          obtain ⟨mid, h_spec1, h_spec2⟩ := h_spec
          -- Each twoRoundsWithPermute.Spec says ∃ mid', roundWithPermute.Spec ... ∧ roundWithPermute.Spec ...
          obtain ⟨mid1, h_spec1_1, h_spec1_2⟩ := h_spec1
          obtain ⟨mid2, h_spec2_1, h_spec2_2⟩ := h_spec2

          simp only [roundWithPermute] at h_spec1_1 h_spec1_2 h_spec2_1 h_spec2_2
          simp only [FourRoundsSpec, applyFourRounds]

          -- Build the result by chaining the four rounds
          constructor <;> aesop
    after: |-
      by sorry
  - before: |-
      by
          -- Prove that sixRoundsWithPermute's spec implies our SixRoundsSpec
          intro input output h_assumptions h_spec
          -- sixRoundsWithPermute.Spec says ∃ mid, fourRoundsWithPermute.Spec input mid ∧ twoRoundsWithPermute.Spec mid output
          obtain ⟨mid, h_spec1, h_spec2⟩ := h_spec
          -- Break down fourRoundsWithPermute.Spec
          obtain ⟨mid1, h_spec1_1, h_spec1_2⟩ := h_spec1
          obtain ⟨mid1_1, h_spec1_1_1, h_spec1_1_2⟩ := h_spec1_1
          obtain ⟨mid1_2, h_spec1_2_1, h_spec1_2_2⟩ := h_spec1_2
          -- Break down twoRoundsWithPermute.Spec
          obtain ⟨mid2, h_spec2_1, h_spec2_2⟩ := h_spec2

          simp only [roundWithPermute] at h_spec1_1_1 h_spec1_1_2 h_spec1_2_1 h_spec1_2_2 h_spec2_1 h_spec2_2
          simp only [SixRoundsSpec, applySixRounds]
          aesop
    after: |-
      by sorry
