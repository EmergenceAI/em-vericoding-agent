Circuit.FoldlM.forAll_iff_const:
  ground_truth_proof: |-
    := by
      rw [forAll_iff (constant:=constant)]
      set k := (circuit default default).localLength
      simp only
      constructor
      · intro h
        constructor
        · specialize h 0
          simp only [Fin.val_zero] at h
          rw [foldlAcc_zero, zero_mul, add_zero] at h
          exact h
        · intro i hi
          specialize h ⟨ i + 1, hi ⟩
          rw [foldlAcc_const_succ constant h_const_out] at h
          convert h using 3
          rw [ConstantLength.length_eq_default constant (init, _)]
          rfl
      intro h i
      rcases i with ⟨ _ | i, hi ⟩
      · simp only [Fin.mk_zero']
        rw [foldlAcc_zero, zero_mul, add_zero]
        exact h.left
      · rw [foldlAcc_const_succ constant h_const_out]
        convert (h.right i hi) using 3
        rw [ConstantLength.length_eq_default constant (init, _)]
        rfl
Circomlib.MultiAND.main_output_binary_from_completeness:
  ground_truth_proof: |-
    := by
      apply main_output_binary
      · assumption
      · assumption
      apply Circuit.can_replace_completeness (n := offset)
      · apply subcircuitsConsistent
      · rw [main_usesLocalWitnesses_iff_completeness]
        · exact h_local_witnesses
        · rfl
      · exact h_completeness
Circuit.ext:
  thm_stmt: |-
    @[ext]
    theorem ext {f g : Circuit F α}
      (h_output : ∀ n, f.output n = g.output n)
      (h_operations : ∀ n, f.operations n = g.operations n) :
        f = g
Imp.Hoare.hoare_while:
  ground_truth_proof: |-
    := by
      intro hHoare st st' hPre hEval
      -- we proceed by induction on `hEval`
      generalize hloop : c_while b c = cmd at *
      induction hEval with simp at *
      | e_whileFalse =>
        constructor
        . exact hPre
        . simp [*]
      | e_whileTrue =>
        simp [*] at *
        rename_i ih
        apply ih
        apply hHoare
        . constructor
          . apply hPre
          . assumption
        . assumption
